name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: run pytest in every uv project
        run: |
          set -euo pipefail
          for proj in $(find . -name pyproject.toml -not -path '*/.venv/*' -exec dirname {} \;); do
            echo "::group::$proj"
            (cd "$proj" && uv sync --frozen && uv run pytest -vvv)
            echo "::endgroup::"
          done

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: run cargo test in every cargo project
        run: |
          set -euo pipefail
          for proj in $(find . -name Cargo.toml -not -path '*/target/*' -exec dirname {} \;); do
            echo "::group::$proj"
            (cd "$proj" && cargo test)
            echo "::endgroup::"
          done
