[project]
name = "api-requests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yoichi ojima", email = "yoichiojima@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api-requests = "api_requests.main:main"
fake-api = "api_requests.fake_api:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
