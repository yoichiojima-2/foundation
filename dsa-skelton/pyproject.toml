[project]
name = "dsa-skelton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yoichi ojima", email = "yoichiojima@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
dsa-skelton = "dsa_skelton:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["walk_*.py"]
