[project]
name = "reverse-linked-list"
version = "0.1.0"
authors = [
    { name = "yoichi ojima", email = "yoichiojima@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dsa",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
dsa = { path = "../../dsa", editable = true }
